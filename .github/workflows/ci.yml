name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests and coverage
        run: python -m pytest --junitxml=artifacts/test-results.xml --cov-report=xml:artifacts/coverage.xml
      - name: Snowflake SQL lint
        run: python -m sqlfluff lint sql/snowflake --dialect snowflake
      - name: Build package
        run: python -m build
      - name: CLI smoke
        run: |
          python -m pharma_data_product init --database artifacts/batch-data.db
          python -m pharma_data_product ingest --database artifacts/batch-data.db --input examples/batch-events.ndjson
          python -m pharma_data_product summary --database artifacts/batch-data.db
      - uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: |
            artifacts/test-results.xml
            artifacts/coverage.xml
            dist/*

